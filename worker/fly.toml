# Fly.io app config for the AuroraGrants worker.
# Deploy: `fly deploy -a auroragrants-worker`

app = "auroragrants-worker"
primary_region = "sea"  # Seattle = nearest US-West to Alaska
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "8080"
LOG_LEVEL = "info"
AWS_REGION = "us-west-2"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[http_service.concurrency]
type = "requests"
soft_limit = 20
hard_limit = 25

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[[vm]]
cpu_kind = "shared"
cpus = 2
memory_mb = 2048
