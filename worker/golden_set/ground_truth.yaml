# Hand-labeled ground truth for the Phase 2 parser bake-off.
#
# Each entry below targets one Alaska NOFO or funder guidelines PDF. The
# actual PDF binaries are not tracked in the repo (many are 5+ MB and the
# funder URLs change). Drop the PDFs into worker/golden_set/pdfs/ using the
# slug as the filename (e.g. `rasmuson-legacy-loi.pdf`) before running
# `python worker/scripts/parser_bakeoff.py`. See README.md in this folder.
#
# Field contract:
#   slug                       stable id, matches the PDF filename stem
#   source_url                 where the PDF can be downloaded
#   expected_page_count_range  [lo, hi] so a slightly updated NOFO is OK
#   expected_headings          subset of headings the parser should find;
#                              the scorer treats any extra headings as fine
#   expected_tables            list of {page, n_rows, n_cols, has_header, topic}
#   expected_fields            deadline, award range, eligibility keywords
#   notes                      free text; not scored
version: 1
pdfs:
  - slug: rasmuson-legacy-loi
    source_url: https://rasmuson.org/find-funding/legacy-grants/
    expected_page_count_range: [4, 14]
    expected_headings:
      - "Letter of Inquiry Instructions"
      - "Eligibility"
      - "Required Attachments"
      - "Review Process"
    expected_tables:
      - {page: 3, n_rows: 4, n_cols: 2, has_header: true, topic: "funding range"}
    expected_fields:
      deadline: "rolling"
      award_min_usd: 250000
      award_max_usd: null
      eligibility_keywords:
        - "501(c)(3)"
        - "Alaska"
        - "federally recognized tribe"
    notes: "LOI first then invited proposal."

  - slug: rasmuson-tier-1-instructions
    source_url: https://rasmuson.org/find-funding/tier-1-grants/
    expected_page_count_range: [3, 10]
    expected_headings:
      - "Tier 1 Grant Instructions"
      - "Eligibility"
      - "Award Range"
      - "How to Apply"
    expected_tables: []
    expected_fields:
      deadline: "rolling"
      award_min_usd: 500
      award_max_usd: 35000
      eligibility_keywords:
        - "501(c)(3)"
        - "Alaska"
        - "local government"
        - "federally recognized tribe"
    notes: "Most Tier 1 grants are 5k to 20k."

  - slug: denali-commission-program-1
    source_url: https://denali.gov/grants/
    expected_page_count_range: [8, 30]
    expected_headings:
      - "Program Description"
      - "Eligibility"
      - "Application Instructions"
      - "Reporting Requirements"
      - "Award Information"
    expected_tables:
      - {page: 5, n_rows: 5, n_cols: 3, has_header: true, topic: "award tiers"}
    expected_fields:
      deadline: null
      award_min_usd: 25000
      award_max_usd: 5000000
      eligibility_keywords:
        - "tribe"
        - "local government"
        - "nonprofit"
    notes: "Denali uses SF-424 via denali.gov and the Denali Project Database System."

  - slug: denali-commission-program-2
    source_url: https://denali.gov/grants/
    expected_page_count_range: [8, 30]
    expected_headings:
      - "Program Description"
      - "Eligibility"
      - "Submission Instructions"
      - "Reporting"
    expected_tables:
      - {page: 4, n_rows: 4, n_cols: 2, has_header: true, topic: "reporting cadence"}
    expected_fields:
      deadline: null
      award_min_usd: 25000
      award_max_usd: 5000000
      eligibility_keywords:
        - "tribe"
        - "nonprofit"
    notes: "Second Denali program announcement. Update the source URL with the exact program slug."

  - slug: hud-icdbg-nofo
    source_url: https://www.hud.gov/program_offices/public_indian_housing/ih/grants/icdbg
    expected_page_count_range: [30, 120]
