      - "Federal Award Information"
      - "Eligibility Information"
      - "Application and Submission Information"
      - "Application Review Information"
      - "Federal Award Administration Information"
      - "Reporting"
    expected_tables:
      - {page: 15, n_rows: 8, n_cols: 4, has_header: true, topic: "allocation table"}
      - {page: 40, n_rows: 6, n_cols: 3, has_header: true, topic: "reporting schedule"}
    expected_fields:
      deadline: null
      award_min_usd: null
      award_max_usd: 5000000
      eligibility_keywords:
