# Ground truth for the synthetic NOFO fixture.
# The PDF is generated by build_synthetic.py. It is intentionally small so
# the parser bake-off can run in CI without downloading real NOFOs.
version: 1
slug: synthetic_nofo
source_url: null
expected_page_count_range: [4, 4]
expected_headings:
  - "SYNTHETIC ALASKA COMMUNITY DEVELOPMENT GRANT"
  - "Purpose"
  - "Eligibility"
  - "Funding Range"
  - "Application Instructions"
expected_tables:
  - {page: 3, n_rows: 3, n_cols: 3, has_header: true, topic: "funding range tiers"}
expected_fields:
  deadline: null
  award_min_usd: 25000
  award_max_usd: 500000
  eligibility_keywords:
    - "501(c)(3)"
    - "tribes"
    - "Alaska"
notes: >
  Synthetic fixture. Page 1 has a title and a Purpose heading. Page 2 lists
  eligibility as bullets. Page 3 draws a 3x3 grid table with Tier, Min, Max.
  Page 4 is a numbered list of application steps.
