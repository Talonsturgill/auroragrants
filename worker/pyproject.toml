[project]
name = "auroragrants-worker"
version = "0.1.0"
description = "FastAPI worker for AuroraGrants: PDF parsing, WCE loop, eval harness."
requires-python = ">=3.12"
readme = "../README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../starter"]
addopts = "-v --strict-markers --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
