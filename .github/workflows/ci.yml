name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: placeholder
          CLERK_SECRET_KEY: placeholder

  playwright:
    name: Playwright (E2E + tenant isolation)
    runs-on: ubuntu-latest
    needs: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Supabase migrations (if SUPABASE_DB_URL is configured)
        if: env.SUPABASE_DB_URL != ''
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tenant-isolation.spec.ts

  worker:
    name: Worker (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-ci.txt
      - run: pip install -U pip
      - run: pip install -r requirements-ci.txt
      - run: pip install ruff mypy
      - name: Warm tiktoken cache (cl100k_base)
        continue-on-error: true
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q

  starter-evals-golden:
    name: Starter evals — golden set gate (>= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic openai textstat pytest pytest-asyncio
      - run: pytest starter/evals -q
